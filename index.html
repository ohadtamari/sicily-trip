<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>טיול בסיציליה 🇮🇹</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 3 2%22><rect width=%221%22 height=%222%22 fill=%22%23009246%22/><rect x=%221%22 width=%221%22 height=%222%22 fill=%22%23fff%22/><rect x=%222%22 width=%221%22 height=%222%22 fill=%22%23ce2b37%22/></svg>">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סיציליה">
<meta name="theme-color" content="#009246">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <h1>טיול בסיציליה · 17-27.9.2026</h1>
    <button class="theme-toggle" id="themeToggle" title="החלף מצב תצוגה">🌗</button>
  </header>

  <div class="body-row">

    <nav class="tab-rail" id="tabRail">
      <button class="tab-btn" data-page="itinerary"><span class="tab-icon">🧭</span>מסלול</button>
      <button class="tab-btn" data-page="map"><span class="tab-icon">🗺️</span>מפה</button>
      <button class="tab-btn" data-page="food"><span class="tab-icon">🍽️</span>אוכל</button>
      <button class="tab-btn" data-page="weather"><span class="tab-icon">☀️</span>מזג אוויר</button>
      <button class="tab-btn" data-page="transport"><span class="tab-icon">🚗</span>תחבורה</button>
      <button class="tab-btn" data-page="packing"><span class="tab-icon">🎒</span>ציוד</button>
    </nav>

    <main class="content" id="content">

      <div class="day-context-bar" id="dayContextBar">
        <div class="day-nav">
          <button class="arrow" id="dayNext">▶</button>
          <div class="day-info">
            <div class="day-num" id="dayNumLabel">יום 1 מתוך 11</div>
            <div class="day-date" id="dayDateLabel">17.9 · חמישי</div>
          </div>
          <button class="arrow" id="dayPrev">◀</button>
        </div>
        <button class="btn-all" id="btnAll">הכל</button>
      </div>

      <section id="page-map" class="page">
        <div id="map"></div>
        <div class="map-legend">
          <span>🏨 מלון</span><span>📍 אטרקציה</span><span>🚗 רכב</span><span>🏖️ חוף</span><span>🛬 שדה תעופה</span>
        </div>
      </section>

      <section id="page-itinerary" class="page">
        <div id="itineraryList"></div>
      </section>

      <section id="page-food" class="page">
        <div class="food-grid">
          <div class="food-col">
            <h2>🍽️ מסעדות</h2>
            <div id="placesList"></div>
          </div>
          <div class="food-col">
            <h2>✅ מנות לסימון</h2>
            <div id="dishesList"></div>
          </div>
        </div>
        <div class="food-disclaimer">ℹ️ שעות הפעילות משוערות ולא מאומתות רשמית מול כל מסעדה - מומלץ לבדוק ב-Google Maps / להתקשר לפני ההגעה, בייחוד בסופ"ש ובחגים.</div>
      </section>

      <section id="page-weather" class="page">
        <div class="card" id="weatherCurrentCard">טוען מזג אוויר…</div>
        <div class="card">
          <h2 style="margin-top:0;font-size:1rem;">תחזית</h2>
          <div class="weather-forecast" id="weatherForecast"></div>
          <div class="weather-note" id="weatherNote"></div>
        </div>
      </section>

      <section id="page-transport" class="page">
        <div id="transportContent"></div>
      </section>

      <section id="page-packing" class="page">
        <div id="packingList"></div>
      </section>

    </main>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>

<script src="js/data-trip.js" defer></script>
<script src="js/data-map.js" defer></script>
<script src="js/data-food.js" defer></script>
<script src="js/data-packing.js" defer></script>
<script src="js/data-transport.js" defer></script>

<script src="js/dayContext.js" defer></script>
<script src="js/theme.js" defer></script>
<script src="js/firebase-config.js" defer></script>
<script src="js/sync.js" defer></script>
<script src="js/map.js" defer></script>
<script src="js/weather.js" defer></script>
<script src="js/app.js" defer></script>

</body>
</html>
